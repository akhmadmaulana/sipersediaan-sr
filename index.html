    function calculateMutationMatrix(tahun) {
      return state.items.map((item, idx) => {
        let runningStok = Number(item.stok_awal) || 0;
        let currentHarga = Number(item.harga_satuan) || 0;

        state.transactions
          .filter(t => t.item_id === item.id && Number(t.tahun) < Number(tahun))
          .forEach(t => {
            if (t.jenis === 'MASUK') runningStok += Number(t.qty) || 0;
            else runningStok -= Number(t.qty) || 0;
          });

        const months = {};
        for (let m = 1; m <= 12; m++) {
          const trxMonth = state.transactions.filter(
            t => t.item_id === item.id && Number(t.tahun) === Number(tahun) && Number(t.bulan) === m
          );
          let masuk = 0;
          let keluar = 0;
          let hargaBulan = currentHarga;

          trxMonth.forEach(t => {
            if (t.jenis === 'MASUK') {
              masuk += Number(t.qty) || 0;
              if (Number(t.harga_satuan) > 0) {
                hargaBulan = Number(t.harga_satuan);
                currentHarga = hargaBulan;
              }
            } else {
              keluar += Number(t.qty) || 0;
            }
          });

          const sisa = runningStok + masuk - keluar;
          months[m] = {
            saldo_awal: runningStok,
            harga: hargaBulan,
            masuk,
            keluar,
            sisa
          };
          runningStok = sisa;
        }

        return {
          no: idx + 1,
          item,
          months,
          stok_akhir_tahun: runningStok,
          harga_terakhir: currentHarga,
          nilai_akhir: runningStok * currentHarga
        };
      });
    }

      const item = state.items.find(i => i.id === itemId);
      if (!item) return 0;
      let stok = Number(item.stok_awal) || 0;
      state.transactions
        .filter(t => t.item_id === itemId)
        .forEach(t => {
          if (t.jenis === 'MASUK') stok += Number(t.qty) || 0;
          else stok -= Number(t.qty) || 0;
        });
      return stok;
    }

    // IMPORT & EXPORT EXCEL MUTASI PERSEDIAAN
    // =========================================================================
    window.exportMutasiExcel = () => {
      const matrix = calculateMutationMatrix(state.selectedYear);
      const aoa = [];

      aoa.push([`REKAPITULASI MUTASI BARANG PERSEDIAAN`]);
      aoa.push([state.settings.nama_sekolah.toUpperCase()]);
      aoa.push([]);

      const row4 = ['NO', 'NAMA BARANG', 'SUMBER PEROLEHAN/PENGADAAN', 'SATUAN BARANG', `TAHUN ${state.selectedYear}`];
      for (let i = 1; i < 48; i++) row4.push('');
      aoa.push(row4);

      const row5 = ['', '', '', ''];
      BULAN_LIST.forEach(bln => {
        row5.push(bln, '', '', '');
      });
      aoa.push(row5);

      const row6 = ['', '', '', ''];
      BULAN_LIST.forEach(bln => {
        row6.push('HARGA BARANG', 'MASUK', 'KELUAR', `SISA ${bln}`);
      });
      aoa.push(row6);

      matrix.forEach((row) => {
        const line = [row.no, row.item.nama_barang, row.item.sumber_pengadaan, row.item.satuan];
        for (let m = 1; m <= 12; m++) {
          const md = row.months[m];
          line.push(md.harga, md.masuk, md.keluar, md.sisa);
        }
        aoa.push(line);
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!merges'] = [
        { s: { r: 3, c: 0 }, e: { r: 5, c: 0 } },
        { s: { r: 3, c: 1 }, e: { r: 5, c: 1 } },
        { s: { r: 3, c: 2 }, e: { r: 5, c: 2 } },
        { s: { r: 3, c: 3 }, e: { r: 5, c: 3 } },
        { s: { r: 3, c: 4 }, e: { r: 3, c: 51 } }
      ];
      for (let m = 0; m < 12; m++) {
        ws['!merges'].push({ s: { r: 4, c: 4 + m * 4 }, e: { r: 4, c: 4 + m * 4 + 3 } });
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `Mutasi_${state.selectedYear}`);
      XLSX.writeFile(wb, `Mutasi_Persediaan_${state.settings.singkatan_sekolah.replace(/\s+/g, '_')}_${state.selectedYear}.xlsx`);
      showToast('File Excel Mutasi Persediaan berhasil diunduh!');
    };

    window.handleImportMutasiExcel = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

        let importedCount = 0;
        for (let r = 6; r < rows.length; r++) {
          const row = rows[r];
          if (!row || !row[1]) continue;
          const namaBarang = String(row[1]).trim();
          const sumber = row[2] ? String(row[2]).trim() : 'Sekolah';
          const satuan = row[3] ? String(row[3]).trim() : 'Pcs';

          let itemObj = state.items.find(i => i.nama_barang.toLowerCase() === namaBarang.toLowerCase());
          const firstHarga = Number(row[4]) || 0;

          if (!itemObj) {
            const newItem = {
              kode_barang: `PRS-${Date.now().toString().slice(-4)}-${r}`,
              nama_barang: namaBarang,
              satuan,
              sumber_pengadaan: sumber,
              harga_satuan: firstHarga,
              stok_awal: 0
            };
            if (IS_PREVIEW) {
              itemObj = { id: 'item-imp-' + Date.now() + r, ...newItem };
              state.items.push(itemObj);
            } else {
              const docRef = await addDoc(collection(db, 'items'), newItem);
              itemObj = { id: docRef.id, ...newItem };
            }
          }

          for (let m = 0; m < 12; m++) {
            const baseCol = 4 + m * 4;
            const harga = Number(row[baseCol]) || itemObj.harga_satuan || 0;
            const masuk = Number(row[baseCol + 1]) || 0;
            const keluar = Number(row[baseCol + 2]) || 0;
            const blnStr = String(m + 1).padStart(2, '0');

            if (masuk > 0) {
              const trxM = {
                tanggal: `${state.selectedYear}-${blnStr}-05`,
                bulan: m + 1,
                tahun: state.selectedYear,
                jenis: 'MASUK',
                item_id: itemObj.id,
                nama_barang: itemObj.nama_barang,
                satuan: itemObj.satuan,
                qty: masuk,
                harga_satuan: harga,
                keterangan: 'Import Excel Mutasi'
              };
              if (IS_PREVIEW) state.transactions.push({ id: 'trx-imp-m-' + Date.now() + r + m, ...trxM });
              else await addDoc(collection(db, 'transactions'), trxM);
            }
            if (keluar > 0) {
              const trxK = {
                tanggal: `${state.selectedYear}-${blnStr}-20`,
                bulan: m + 1,
                tahun: state.selectedYear,
                jenis: 'KELUAR',
                item_id: itemObj.id,
                nama_barang: itemObj.nama_barang,
                satuan: itemObj.satuan,
                qty: keluar,
                harga_satuan: harga,
                keterangan: 'Import Excel Mutasi'
              };
              if (IS_PREVIEW) state.transactions.push({ id: 'trx-imp-k-' + Date.now() + r + m, ...trxK });
              else await addDoc(collection(db, 'transactions'), trxK);
            }
          }
          importedCount++;
        }
        showToast(`Berhasil mengimpor ${importedCount} baris data mutasi!`);
        render();
      } catch (err) {
        showToast('Gagal membaca file Excel: ' + err.message, 'error');
      } finally {
        e.target.value = '';
      }
    };

      const totalNilai = matrix.reduce((acc, r) => acc + r.nilai_akhir, 0);
      const totalMasuk = state.transactions.filter(t => t.jenis === 'MASUK' && Number(t.tahun) === Number(state.selectedYear)).reduce((a, b) => a + (Number(b.qty) || 0), 0);

      const chartMonths = [1, 2, 3, 4, 5, 6];
      const maxVal = Math.max(10, ...chartMonths.map(m => {
        return matrix.reduce((sum, r) => sum + r.months[m].sisa, 0);
      }));

      const barsHtml = chartMonths.map((m, idx) => {
        const val = matrix.reduce((sum, r) => sum + r.months[m].sisa, 0);
        const pct = Math.max(18, Math.round((val / maxVal) * 100));
        const pattern = idx % 3 === 0 ? 'bg-striped-yellow' : (idx % 3 === 1 ? 'bg-striped-purple' : 'bg-striped-green');

                    </div>
                    <div class="flex items-center gap-1.5 text-[10px] sm:text-[11px] font-semibold text-slate-500 truncate">
                      <span class="text-amber-700 font-bold">"${escapeHtml(s.app_tagline)}"</span>
                      <span class="hidden sm:inline">•</span>
                      <span class="hidden sm:inline truncate">${escapeHtml(s.nama_sekolah)}</span>
                    </div>
                  </div>
                </div>

                <div class="hidden lg:flex items-center bg-white rounded-full px-4 py-2.5 w-full max-w-sm border border-slate-200/70 shadow-sm">
                  <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2.5 shrink-0"></i>
                  <input
                    type="text"
                    value="${escapeHtml(state.searchQuery)}"
                    oninput="state.searchQuery = this.value; if(state.activeTab !== 'master') state.activeTab = 'master'; render();"
                    placeholder="Cari barang persediaan..."
                    class="bg-transparent text-xs font-medium text-slate-700 w-full focus:outline-none"
                  />
                </div>

                <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
                  ${IS_PREVIEW ? `<span class="hidden xl:inline-flex items-center px-3 py-1.5 rounded-full bg-accent-yellowSoft text-amber-800 text-[11px] font-bold">Pratinjau</span>` : ''}

                  <select onchange="state.selectedYear = Number(this.value); render();" class="px-2.5 sm:px-3.5 py-2 rounded-full bg-white border border-slate-200/80 text-xs font-extrabold text-slate-700 shadow-sm">
                    ${YEAR_LIST.map(yr => `<option value="${yr}" ${state.selectedYear === yr ? 'selected' : ''}>${yr}</option>`).join('')}
                  </select>

                  <button onclick="setActiveTab('opname')" title="Berita Acara Opname Fisik" class="hidden sm:flex w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white border border-slate-200/80 items-center justify-center text-slate-600 hover:text-brand shadow-sm transition">
                    <i data-lucide="clipboard-check" class="w-4 h-4"></i>
                  </button>

                  <button onclick="handleLogout()" title="Keluar Aplikasi" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-white border border-slate-200/80 flex items-center justify-center text-rose-500 hover:bg-rose-50 shadow-sm transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                  </button>

                  <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-brand text-white font-extrabold text-xs flex items-center justify-center shadow-sm shrink-0">
                    ${escapeHtml((state.user.nama || 'U').slice(0, 2).toUpperCase())}
                  </div>
                </div>
              </div>

              <div class="flex lg:hidden items-center bg-white rounded-full px-3.5 py-2 w-full border border-slate-200/70 shadow-xs">
                <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 mr-2 shrink-0"></i>
                <input
                  type="text"
                  value="${escapeHtml(state.searchQuery)}"
                  oninput="state.searchQuery = this.value; if(state.activeTab !== 'master') state.activeTab = 'master'; render();"
                  placeholder="Cari nama barang persediaan atau kode..."
                  class="bg-transparent text-xs font-medium text-slate-700 w-full focus:outline-none"
                />
              </div>
            </div>
          </header>

          <div class="max-w-[1440px] w-full mx-auto px-3 sm:px-6 md:px-8 flex-1 flex gap-6 pt-2">
            <aside class="no-print hidden md:flex flex-col items-center justify-between py-2 shrink-0">
              <div class="floating-rail p-2 flex flex-col items-center gap-2.5 sticky top-24">
                ${navItems.map(item => {
                  const isActive = state.activeTab === item.id;
                  return `
                    <button
                      onclick="setActiveTab('${item.id}')"
                      title="${item.label}"
                      class="group relative w-12 h-12 rounded-full flex items-center justify-center transition-all duration-200 ${isActive ? 'bg-brand text-white shadow-md shadow-brand/25' : 'text-slate-500 hover:bg-canvas hover:text-slate-900'}"
                    >
                      <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                      <span class="pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity absolute left-14 px-3 py-1.5 rounded-full bg-slate-900 text-white text-xs font-bold whitespace-nowrap shadow-lg z-50">
                        ${item.label}
                      </span>
                    </button>
                  `;
                }).join('')}
              </div>
            </aside>

            <main class="flex-1 min-w-0">
              ${contentHtml}
            </main>
          </div>

          <nav class="no-print md:hidden fixed bottom-3 inset-x-3 z-40 floating-rail px-2 py-1.5 flex items-center justify-around overflow-x-auto">
            ${navItems.map(item => {
              const isActive = state.activeTab === item.id;
              return `
                <button
                  onclick="setActiveTab('${item.id}')"
                  class="flex flex-col items-center justify-center min-w-[46px] py-1.5 px-2 rounded-2xl transition ${isActive ? 'bg-brand text-white shadow-sm' : 'text-slate-500'}"
                >
                  <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                  <span class="text-[9px] font-bold mt-0.5 truncate max-w-[52px]">${item.label.split(' ')[0]}</span>
                </button>
              `;
            }).join('')}
          </nav>
        </div>

        ${currentModalHtml ? `
          <div class="no-print fixed inset-0 z-[99990] bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl w-full max-w-2xl shadow-2xl border border-slate-100 overflow-hidden">
              ${currentModalHtml}
            </div>
          </div>
        ` : ''}

        ${state.confirmModal ? `
          <div class="no-print fixed inset-0 z-[99998] bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-slate-100 text-center">
              <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
              </div>
              <h4 class="font-extrabold text-slate-900 text-base mb-1">${escapeHtml(state.confirmModal.title)}</h4>
              <p class="text-xs text-slate-500 mb-5">${escapeHtml(state.confirmModal.message)}</p>
              <div class="flex justify-center gap-2.5">
                <button onclick="closeConfirmModal()" class="px-5 py-2 rounded-full bg-canvas text-slate-700 text-xs font-bold">Batal</button>
                <button onclick="executeConfirmAction()" class="px-5 py-2 rounded-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Ya, Hapus</button>
              </div>
            </div>
          </div>
        ` : ''}

        ${renderPrintModal()}
      `;
    }

    // =========================================================================
    // RENDER ENGINE UTAMA
    // =========================================================================
    function render() {
      const root = document.getElementById('app-root');
      if (!state.user) {
        root.innerHTML = renderLoginScreen();
      } else {
        root.innerHTML = renderAppShell();
      }
      lucide.createIcons();
    }
    window.render = render;

    render();
  </script>
</body>
</html>
